services:
  ledger-lab-postgres:
    container_name: ledger-lab-postgres
    image: postgres:16
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}

volumes:
  data: {}
